<!DOCTYPE html>
<head>
    <title>Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>     
<body> 
    <div class="Home"> 
        <a href="index.html">   <img src="home.jpeg" class="img">  </a>	<a href="text-to-speech converter.html"> <img src="voice.jpeg" class="img">  </a>  
    </div>
    <div class="container">
        <div class="app-container">
            <div class="headings-container">
                <h1>
                    Word Counter Tool
                </h1>
                <h3>
                    Enter your text below to count the number of words.
                </h3>
            </div>
            <div class="interaction-container">
                <textarea id="textInput"
                        placeholder="Enter text here..."
                        cols="40"
                        rows="15" class="text-control">
                </textarea>
                <p id="wordCountResult" class="word-count">Word Count: 0</p>
            </div> 
        </div>
    </div>
    <script src="script1.js"></script>
</body>
</html>
